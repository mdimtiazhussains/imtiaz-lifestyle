      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#ffffff"/>
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
  
  <!-- Four Google Color Accent Dots -->
